name: PR Build

on:
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-2022

    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          submodules: recursive

      - name: Setup Python 3.10
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install build dependencies
        run: python -m pip install --quiet PySide2==5.15.2.1 psutil==6.1.1 py2exe==0.14.2.0 pytest

      - name: Test
        run: python -m pytest tests/test_ams2_connector.py tests/test_watchlist.py -q -p no:cacheprovider

      - name: Build
        run: python freeze_py2exe.py -c
